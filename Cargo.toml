[package]
name = "git-tulkun"
version = "0.1.2"
edition = "2021"
description = "Draw a procedural pixel-art Pandoran Tulkun whale from a GitHub account's commits and language colors, as a looping GIF for a profile README."
license = "MIT"
keywords = ["github", "profile", "tulkun", "pixel-art", "gif"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
gif = "0.13"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
